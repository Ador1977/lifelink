{% extends "base.html" %}
{% block title %}Reset Password — LifeLink{% endblock %}
{% block content %}
<div class="form-card">
  <h2 class="form-title">Set a new password</h2>
  <p class="form-sub">Must be at least 8 characters with upper, lower, digit and special character.</p>
  <form method="POST">
    <div class="form-group">
      <label>New Password</label>
      <input type="password" name="new_password" required autofocus>
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <input type="password" name="confirm_password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
  </form>
  <div class="form-footer">
    <a href="{{ url_for('login') }}" style="color: var(--critical); font-weight: 600;">Back to login</a>
  </div>
</div>
{% endblock %}
