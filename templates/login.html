{% extends "base.html" %}
{% block title %}Log In — LifeLink{% endblock %}
{% block content %}
<div class="form-card">
  <h2 class="form-title">Welcome back</h2>
  <p class="form-sub">Log in to manage requests and donations.</p>
  <form method="POST">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log In</button>
    <div style="text-align:center; margin-top:0.75rem;">
      <a href="{{ url_for('forgot_password') }}" style="font-size:0.85rem; color: var(--critical); font-weight: 600;">Forgot password?</a>
    </div>
  </form>
  <div class="form-footer">
    New here? <a href="{{ url_for('register') }}" style="color: var(--critical); font-weight: 600;">Create an account</a>
  </div>
</div>
{% endblock %}
