{% extends "base.html" %}
{% block title %}{{ code }} Error — LifeLink{% endblock %}
{% block content %}
<div class="form-card" style="text-align:center; padding:3rem 2rem;">
  <h1 style="font-size:3rem; font-family:var(--font-mono); color:var(--critical); margin-bottom:0.5rem;">{{ code }}</h1>
  <p style="font-size:1.1rem; color:var(--muted); margin-bottom:1.5rem;">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
