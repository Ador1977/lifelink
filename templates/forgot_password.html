{% extends "base.html" %}
{% block title %}Forgot Password — LifeLink{% endblock %}
{% block content %}
<div class="form-card">
  <h2 class="form-title">Forgot your password?</h2>
  <p class="form-sub">Enter your account email and we'll send you a reset link.</p>
  <form method="POST">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required autofocus placeholder="you@example.com">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
  </form>
  <div class="form-footer">
    Remembered it? <a href="{{ url_for('login') }}" style="color: var(--critical); font-weight: 600;">Back to login</a>
  </div>
</div>
{% endblock %}
